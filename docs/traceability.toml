# Product requirements (docs/product.md, "Requirements and traceability") and the automated
# tests that give evidence for them. Entries are paths relative to the repository root: a test
# directory ending in "/", a module, or a module and test name as `path.py::test_name` or
# `path.py::TestClass`. A test may serve several requirements. Every test must be traced, under
# a requirement or under [project]; [skips] lists the tests that may be skipped, with the reason.
# The validation pack of a release is built from this map (docs/operations.md).

