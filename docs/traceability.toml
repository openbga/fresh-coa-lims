[skips]
# Single tests that may skip where a pack is built, and why. Any other skip leaves the pack
# incomplete.
"reporting/tests/test_services.py::test_write_review_pdfs" = "Writes certificates to OQ_PDF_OUT for a person to look at; it checks nothing when that is not set."
"tests/test_backup_restore_checks.py::test_backup_restore_and_verify_round_trip" = "Needs pg_dump and pg_restore of the server's major version or newer, which CI's application job lacks; CI's container-smoke job runs the same backup, restore and check cycle with the application image."
"reporting/tests/test_certificate_pdf.py::test_write_certificate_review_pdfs" = "Writes certificates to OQ_PDF_OUT for a person to look at; it checks nothing when that is not set."
"tests/test_lot_record_export.py::test_write_lot_record_review_pdfs" = "Writes printed lot records to OQ_PDF_OUT for a person to look at; it checks nothing when that is not set."
