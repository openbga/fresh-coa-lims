[project]
name = "open-qual-iq"
version = "0.1.0"
description = "Manufacturing quality-control laboratory records"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-only"
dependencies = [
  "Django>=5.2.19,<5.3",
  "psycopg[binary]>=3.3.8,<4",
  "gunicorn>=26.2,<27",
  "whitenoise>=6.12,<7",
  "dj-database-url>=3,<4",
  "weasyprint>=70,<71",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-django>=4.14,<5", "ruff>=0.17.4,<0.18"]
e2e = [
    "pytest-playwright>=0.10,<0.11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "accounts/tests", "catalog/tests", "sampling/tests", "analytical/tests", "laboratory/tests", "stability/tests", "reporting/tests", "pagedocs/tests"]


[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
