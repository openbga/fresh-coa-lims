{% comment %}Sibling page links, above the variable-height page header. Context: tabs [{label, url, current}].{% endcomment %}
<nav class="vr-section-tabs" aria-label="Section navigation">
  <ul class="nav nav-tabs">
    {% for tab in tabs %}<li class="nav-item"><a class="nav-link{% if tab.current %} active{% endif %}" href="{{ tab.url }}"{% if tab.current %} aria-current="page"{% endif %}>{{ tab.label }}</a></li>{% endfor %}
  </ul>
</nav>
