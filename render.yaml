# Render Blueprint for OpenBGA Fresh CoA LIMS: one Docker web service built from Dockerfile and one
# PostgreSQL 17 database. Migrations run before each deploy, /health/ is the health check and
# the database accepts no external connections. This is the project's synthetic demonstration:
# it deploys develop automatically once the commit's CI checks pass. Adjust names, plans and
# region for your own account; for a controlled deployment set a release branch and
# autoDeployTrigger "off", then deploy reviewed commits manually (docs/operations.md).
# databaseName/user stay "open_qual": they identify stored data and are not renamed.
# render.demo.yaml is a separate Blueprint, for the demonstration only: its daily reset job.
services:
  - type: web
    name: fresh-coa-lims
    runtime: docker
    plan: 1c-2g
    region: virginia
    branch: develop
    autoDeployTrigger: checksPass
    healthCheckPath: /health/
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fresh-coa-lims-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TIME_ZONE
        value: UTC
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.dummy.EmailBackend
      # Anyone can sign in to the published demonstration accounts, and raw-data files are
      # stored in the database: keep each file small and cap them together (1 MiB, 256 MiB).
      # Remove both for your own deployment to use the 10 MiB default with no ceiling.
      - key: RAW_DATA_MAX_BYTES
        value: "1048576"
      - key: RAW_DATA_TOTAL_MAX_BYTES
        value: "268435456"

databases:
  - name: fresh-coa-lims-db
    databaseName: open_qual
    user: open_qual
    plan: 0.5c-1g
    region: virginia
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: []
