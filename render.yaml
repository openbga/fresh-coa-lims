# Render Blueprint for OpenBGA Fresh CoA LIMS: one Docker web service built from Dockerfile and one
# PostgreSQL 17 database. Migrations run before each deploy, /health/ is the health check,
# automatic deploys are off and the database accepts no external connections. Adjust names,
# plans and region for your own account.
# databaseName/user stay "open_qual": they identify stored data and are not renamed.
services:
  - type: web
    name: fresh-coa-lims
    runtime: docker
    plan: 1c-2g
    region: virginia
    autoDeployTrigger: "off"
    healthCheckPath: /health/
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fresh-coa-lims-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TIME_ZONE
        value: UTC
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.dummy.EmailBackend

databases:
  - name: fresh-coa-lims-db
    databaseName: open_qual
    user: open_qual
    plan: 0.5c-1g
    region: virginia
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: []
