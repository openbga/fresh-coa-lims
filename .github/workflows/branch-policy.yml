name: branch-policy

# `main` holds released state and is updated only by a pull request from `develop`.
# The `release-source` check is required by the `main` ruleset; it reads only event
# metadata, so it runs under `pull_request` with a read-only token and no checkout.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  release-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Require develop of this repository as the source
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != develop ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from $BASE_REPO:develop (got $HEAD_REPO:$HEAD_REF). Open your pull request against develop."
            exit 1
          fi
