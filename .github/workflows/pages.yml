name: Publish presentation

# Builds the static presentation in website/ and publishes it to GitHub Pages at
# https://openbga.github.io/qlab/. It is published from main only, the released state;
# the github-pages environment refuses deployments from any other branch.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/build_website.py"
      - "static/css/app.css"
      - "static/img/mark.svg"
      - "static/vendor/bootstrap-5.3.8/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Standard library only: copies website/ and the shared UI assets into build/website.
      - name: Build the presentation
        run: python3 scripts/build_website.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
