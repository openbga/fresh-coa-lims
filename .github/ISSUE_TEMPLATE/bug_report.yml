name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Use synthetic data only. Never include real laboratory, customer or personal data, passwords, PINs, secrets or database dumps.
        Do not report security vulnerabilities here: use the private reporting link on the issue chooser page.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the behavior you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, including the role you were signed in as. Use synthetic data.
      placeholder: |
        1. Sign in as ...
        2. Open ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version or the commit hash of the source you are running.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Local development (runserver)
        - Docker Compose
        - Container image
        - Hosted service
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove real data, passwords, PINs, tokens and other secrets before pasting.
      render: shell
    validations:
      required: false
