{% comment %}Sortable column header. Parameters: label, key (ascending key), current (active sort key).{% endcomment %}
<th scope="col"{% if current == key %} aria-sort="ascending"{% elif current == "-"|add:key %} aria-sort="descending"{% endif %}><a class="vr-sort" href="{% if current == key %}{% querystring sort='-'|add:key page=None %}{% else %}{% querystring sort=key page=None %}{% endif %}">{{ label }}<span class="visually-hidden">{% if current == key %}, sorted ascending; activate to sort descending{% else %}, activate to sort{% endif %}</span></a></th>
