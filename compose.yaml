# Local development and evaluation only. Credentials here are local examples; never use this
# file, or the evaluation profile's DEBUG mode, for a real deployment.
#
# Database for local development (port 55433 on 127.0.0.1; override with DB_PORT):
#   docker compose up -d db
#
# Whole application for local evaluation (http://127.0.0.1:8000/; override with WEB_PORT):
#   docker compose --profile evaluation up --build -d
# It builds the application image, waits for the database, applies migrations and serves
# plain HTTP on 127.0.0.1 with DEBUG=true. No data is seeded; create accounts with
# `docker compose exec web python manage.py ...`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: open_qual
      POSTGRES_PASSWORD: open_qual
      POSTGRES_DB: open_qual
    ports:
      - "127.0.0.1:${DB_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_qual -d open_qual"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: [evaluation]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Plain HTTP needs DEBUG=true: without it the application redirects to HTTPS and uses
      # secure-only cookies. DEBUG also uses a fixed development key and shows error details.
      DEBUG: "true"
      DATABASE_URL: postgresql://open_qual:open_qual@db:5432/open_qual
      ALLOWED_HOSTS: localhost,127.0.0.1
      WEB_CONCURRENCY: "2"
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput
        && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
        --workers "$${WEB_CONCURRENCY}" --timeout 60 --access-logfile - --error-logfile -
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres_data:
