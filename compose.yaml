services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: open_qual
      POSTGRES_PASSWORD: open_qual
      POSTGRES_DB: open_qual
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_qual -d open_qual"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
